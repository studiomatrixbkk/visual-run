<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>VISUAL RUN 3.0 — Render Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: 'Kanit', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; outline: none; }
  #canvas:focus { outline: none; }

  /* ---------- loading screen: the stage "rendering" ---------- */
  #loader { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .bg { position: absolute; inset: 0; background: url('loading.jpg') center / cover no-repeat;
    filter: grayscale(.15) contrast(1.15) brightness(.42); animation: push 18s ease-out forwards; }
  @keyframes push { from { transform: scale(1.0); } to { transform: scale(1.08); } }
  #loader .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%); }
  .box { position: relative; width: min(560px, 86vw); text-align: center; }
  .logo { font-weight: 700; font-size: clamp(26px, 5.4vw, 62px); letter-spacing: .3em; margin-left: .3em; line-height: 1; white-space: nowrap; }
  .rule { width: 110px; height: 3px; background: #ff0a12; margin: 16px auto 10px; }
  .sub { color: #ff0a12; font-weight: 500; font-size: 13px; letter-spacing: .6em; margin-left: .6em; }
  /* Cycles-style render buckets that fill in as the game downloads */
  .buckets { display: grid; grid-template-columns: repeat(32, 1fr); gap: 3px; margin: 30px 0 14px; }
  .buckets i { aspect-ratio: 1; border: 1px solid rgba(255,255,255,.18); background: transparent; transition: background .25s, border-color .25s; }
  .buckets i.on { background: #e8e8e8; border-color: #e8e8e8; }
  .buckets i.now { border-color: #ff0a12; box-shadow: 0 0 8px #ff0a12; }
  .status { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .12em; color: #9a9a9a; font-weight: 300; }
  .status b { color: #fff; font-weight: 500; }
  .tip { margin-top: 26px; min-height: 1.4em; font-size: 15px; color: #d8d8d8; font-weight: 300; transition: opacity .4s; }
  .err { color: #ff4a50; margin-top: 18px; font-size: 14px; display: none; white-space: pre-line; }

  /* ---------- landscape only ---------- */
  #rotate { position: fixed; inset: 0; z-index: 20; background: #000; display: none; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  #rotate .phone { width: 46px; height: 80px; border: 3px solid #fff; border-radius: 9px; position: relative; animation: turn 2.2s ease-in-out infinite; }
  #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #ff0a12; }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
  #rotate h2 { font-weight: 500; font-size: 20px; margin: 34px 0 6px; }
  #rotate p { margin: 0; color: #9a9a9a; font-size: 14px; font-weight: 300; }
  #rotate .logo { font-size: 22px; letter-spacing: .3em; margin-bottom: 40px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<script>
// ---- mobile sound unlock (runs BEFORE the engine creates its AudioContext) ----
// 1) iOS 16.4+: treat game audio as "playback" so the silent switch does not mute it.
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
// 2) remember every AudioContext the engine makes, so a tap can always resume it.
(function () {
  const ctxs = [];
  window.__vrAudioContexts = ctxs;
  ['AudioContext', 'webkitAudioContext'].forEach(function (name) {
    const Orig = window[name];
    if (!Orig) return;
    const Wrapped = function () { const c = new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    Wrapped.prototype = Orig.prototype;
    window[name] = Wrapped;
  });
  // 3) every tap / key: resume suspended contexts; first tap also plays 1 s of silence through an
  //    <audio> tag, which switches older iOS to the media audio session (sound even with the silent switch on).
  let silent = null;
  function unlock() {
    ctxs.forEach(function (c) { if (c.state !== 'running') c.resume().catch(function () {}); });
    if (!silent) {
      silent = new Audio('silence.mp3');
      silent.setAttribute('playsinline', '');
      silent.loop = true;
      silent.volume = 0.01;
      silent.play().catch(function () { silent = null; });
    }
  }
  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, unlock, { capture: true, passive: true });
  });
  // coming back to the tab (phone lock screen / app switch) suspends audio: resume on return
  document.addEventListener('visibilitychange', function () { if (!document.hidden) unlock(); });
})();
</script>
</head>
<body>
<canvas id="canvas">เบราว์เซอร์นี้ไม่รองรับ HTML5 canvas</canvas>

<div id="loader">
  <div class="bg"></div><div class="vig"></div>
  <div class="box">
    <div class="logo">VISUAL RUN</div>
    <div class="rule"></div>
    <div class="sub">RENDER PASS</div>
    <div class="buckets" id="buckets"></div>
    <div class="status"><span>กำลังเรนเดอร์เวที…</span><span><b id="pct">0</b>%</span></div>
    <div class="tip" id="tip"></div>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="rotate">
  <div class="logo">VISUAL RUN</div>
  <div class="phone"></div>
  <h2>หมุนมือถือเป็นแนวนอน</h2>
  <p>เกมนี้เล่นได้เฉพาะแนวนอน</p>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":32287292,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  // ---- render buckets ---------------------------------------------------
  const N = 64, grid = document.getElementById('buckets'), cells = [];
  for (let i = 0; i < N; i++) { const c = document.createElement('i'); grid.appendChild(c); cells.push(c); }
  // fill order like Cycles' spiral-ish tiles: shuffled but stable
  const order = cells.map((_, i) => i).sort((a, b) => ((a * 37) % N) - ((b * 37) % N));
  const pctEl = document.getElementById('pct');
  let shown = 0;
  function setProgress(f) {
    const want = Math.floor(Math.max(0, Math.min(1, f)) * N);
    for (let k = shown; k < want; k++) cells[order[k]].classList.add('on');
    cells.forEach(c => c.classList.remove('now'));
    if (want < N) cells[order[want]].classList.add('now');
    shown = Math.max(shown, want);
    pctEl.textContent = Math.floor(f * 100);
  }

  // ---- tips ---------------------------------------------------------------
  const tips = [
    'แตะซ้าย / Space = กระโดด (กดซ้ำ = กระโดด 2 จังหวะ)',
    'แตะขวา / S = สไลด์ มุดหน้าต่าง Render Error',
    'พื้น wireframe ยังเรนเดอร์ไม่เสร็จ เหยียบไม่ได้',
    'เก็บ R-E-N-D-E-R ให้ครบ = RENDER COMPLETE คะแนน x2',
    'GPU BOOST พุ่งทะลุทุกอย่าง และผลักพี่พลถอย',
    'จอค้าง Not Responding… แต่พี่พลไม่ค้าง',
  ];
  const tipEl = document.getElementById('tip');
  let ti = 0;
  function nextTip() { tipEl.style.opacity = 0; setTimeout(() => { tipEl.textContent = tips[ti++ % tips.length]; tipEl.style.opacity = 1; }, 400); }
  nextTip();
  const tipTimer = setInterval(nextTip, 3200);

  // ---- landscape lock: fullscreen + orientation lock on the first tap (Android);
  //      iOS cannot lock, the rotate screen covers portrait instead.
  const isTouch = matchMedia('(pointer: coarse)').matches;
  function lockLandscape() {
    if (!isTouch) return;
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    const p = fs ? Promise.resolve(fs.call(el)).catch(() => {}) : Promise.resolve();
    p.then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); });
  }
  window.addEventListener('pointerdown', lockLandscape, { once: true });
  window.addEventListener('touchend', lockLandscape, { once: true });

  // ---- start ---------------------------------------------------------------
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  const errEl = document.getElementById('err');
  function fail(msg) { errEl.style.display = 'block'; errEl.textContent = 'Render Failed\n' + msg; }
  if (missing.length !== 0) {
    fail('เบราว์เซอร์นี้ขาดความสามารถที่เกมต้องใช้:\n' + missing.join('\n'));
    return;
  }
  engine.startGame({
    onProgress: function (current, total) { if (total > 0) setProgress(current / total); },
  }).then(() => {
    setProgress(1);
    clearInterval(tipTimer);
    setTimeout(() => document.getElementById('loader').classList.add('done'), 350);
  }, (err) => fail(String(err && err.message ? err.message : err)));
})();
</script>
</body>
</html>
